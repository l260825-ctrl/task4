<html lang="en">
<head>
<title>Continental Hotel Reservation Form</title>
<style>
body {
    background-color: white;
}
.box {
    background-color: gainsboro;
    width: 550px;
    padding: 10px;
    margin: auto;
}
h2 {
    color: red;
    font-family: Trebuchet MS;
    text-align: center;
    padding-top: 10px;
}
table {
    background-color: lightblue;
    border: 3px double black;
    width: 100%;
}
th {
    text-align: right;
    font-family: Times New Roman;
    border: 1px solid navy;
    padding: 8px;
}
td {
    border: 1px solid navy;
    padding: 8px;
}
</style>
</head>
<body>

<div class="box">
<h2>Continental Hotel Reservation Form</h2>

<form action="/action_page.php">
<table>
    <tr>
        <th><label for="name">Name</label></th>
        <td><input type="text" id="name" name="name" placeholder="Enter your name" size="28"></td>
    </tr>
    <tr>
        <th><label for="email">eMail</label></th>
        <td><input type="email" id="email" name="email" value="info@continental.pk" size="28"></td>
    </tr>
    <tr>
        <th><label for="mobile">Mobile No</label></th>
        <td><input type="text" id="mobile" name="mobile" placeholder="Enter your cell number" size="28"></td>
    </tr>
    <tr>
        <th><label for="arrival">Arrival Time</label></th>
        <td><input type="text" id="arrival" name="arrival" placeholder="Enter your arrival time" size="20"></td>
    </tr>
    <tr>
        <th>Departure</th>
        <td>
            <input type="text" id="dep1" name="dep1" size="16">
            <input type="text" id="dep2" name="dep2" size="20">
        </td>
    </tr>
    <tr>
        <th>Room Type</th>
        <td>
            <input type="radio" id="single" name="room" value="single">Single
            <input type="radio" id="double" name="room" value="double">Double<br>
            <input type="radio" id="suite" name="room" value="suite">Presidential Suite
        </td>
    </tr>
    <tr>
        <th>Preferences</th>
        <td>
            <input type="checkbox" id="smoking" name="smoking">Non-Smoking<br>
            <input type="checkbox" id="internet" name="internet">Internet<br>
            <input type="checkbox" id="mattress" name="mattress">Firm Mattress
        </td>
    </tr>
    <tr>
        <th>Mode of Payment</th>
        <td>
            <input type="checkbox" id="cash" name="cash">Cash
            <input type="checkbox" id="check" name="check">Check<br>
            <input type="checkbox" id="credit" name="credit">Credit Card
            <select id="card" name="card">
                <option value="select">Select Card</option>
                <option value="visa">Visa</option>
                <option value="master">Master Card</option>
            </select>
        </td>
    </tr>
    <tr>
        <td colspan="2" style="text-align:center;">
            <input type="submit" value="Send Data">
        </td>
    </tr>
</table>
</form>
</div>

</body>
</html>
